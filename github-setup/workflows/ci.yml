# Pull request gate. Runs without staging access: no .env, no tunnels, no login.
# The UI suites (scenarios, smoke, filters) need staging and are run by hand or from a runner that can reach it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, scenario sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Scenario specs match docs/test_scenarios/adad_test_scenarios.csv
        run: npm run scenarios:check

  framework:
    name: Framework tests (no login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Framework, generator and TestPoint registry tests
        run: npm run test:framework
        env:
          ADAD_HEADLESS: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: framework-report
          path: reports/
          retention-days: 14
